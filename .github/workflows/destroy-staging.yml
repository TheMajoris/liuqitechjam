name: Destroy staging infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY-STAGING to remove the ECS, network, EIP, and attached volumes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VAR_github_actions_ssh_cidr: ""
  TF_VAR_image_ref: ghcr.io/placeholder/staging:destroy
  BYTEPLUS_ACCESS_KEY: ${{ secrets.BYTEPLUS_ACCESS_KEY }}
  BYTEPLUS_SECRET_KEY: ${{ secrets.BYTEPLUS_SECRET_KEY }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

jobs:
  destroy:
    name: Destroy staging (manual approval)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirmation != 'DESTROY-STAGING' }}
        run: |
          echo 'The confirmation must be exactly DESTROY-STAGING.' >&2
          exit 1

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize HCP Terraform state
        working-directory: deploy/volcengine
        run: terraform init -input=false

      - name: Destroy infrastructure
        working-directory: deploy/volcengine
        run: terraform destroy -input=false -auto-approve -lock-timeout=5m
