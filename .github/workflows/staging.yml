name: Staging build and deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  changes:
    name: Detect infrastructure changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Terraform changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'deploy/volcengine/**'
              - '.github/workflows/staging.yml'
              - '.github/workflows/destroy-staging.yml'

  prebuild:
    name: Pre-build checks
    runs-on: ubuntu-latest
    env:
      BYTEPLUS_ACCESS_KEY: ${{ secrets.BYTEPLUS_ACCESS_KEY }}
      BYTEPLUS_SECRET_KEY: ${{ secrets.BYTEPLUS_SECRET_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pre-build checks
        run: npm run check

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform configuration
        working-directory: deploy/volcengine
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  build:
    name: Build and publish GHCR image
    needs: prebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: image
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          image_ref="ghcr.io/${GH_REPOSITORY,,}:${GITHUB_SHA}"
          docker build --tag "$image_ref" .
          docker push "$image_ref"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

  terraform-plan:
    name: Terraform plan
    needs: [build, changes]
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BYTEPLUS_ACCESS_KEY: ${{ secrets.BYTEPLUS_ACCESS_KEY }}
      BYTEPLUS_SECRET_KEY: ${{ secrets.BYTEPLUS_SECRET_KEY }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_VAR_image_ref: ${{ needs.build.outputs.image_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Determine current runner IPv4
        run: |
          runner_ipv4="$(curl -4fsS https://api.ipify.org)"
          [[ "$runner_ipv4" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TF_VAR_github_actions_ssh_cidr=$runner_ipv4/32" >> "$GITHUB_ENV"

      - name: Initialize HCP Terraform state
        working-directory: deploy/volcengine
        run: terraform init -input=false

      - name: Create saved plan
        working-directory: deploy/volcengine
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-terraform-plan-${{ github.sha }}
          path: deploy/volcengine/tfplan
          retention-days: 1

  deploy:
    name: Deploy to staging (manual approval)
    needs: [build, changes, terraform-plan]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy_app.outputs.app_url }}
    permissions:
      contents: read
    env:
      BYTEPLUS_ACCESS_KEY: ${{ secrets.BYTEPLUS_ACCESS_KEY }}
      BYTEPLUS_SECRET_KEY: ${{ secrets.BYTEPLUS_SECRET_KEY }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_VAR_image_ref: ${{ needs.build.outputs.image_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download saved Terraform plan
        if: needs.changes.outputs.terraform == 'true'
        uses: actions/download-artifact@v4
        with:
          name: staging-terraform-plan-${{ github.sha }}
          path: deploy/volcengine

      - name: Determine current runner IPv4
        run: |
          runner_ipv4="$(curl -4fsS https://api.ipify.org)"
          [[ "$runner_ipv4" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TF_VAR_github_actions_ssh_cidr=$runner_ipv4/32" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialize HCP Terraform state
        working-directory: deploy/volcengine
        run: terraform init -input=false

      - name: Review the pre-approval saved plan
        if: needs.changes.outputs.terraform == 'true'
        working-directory: deploy/volcengine
        run: terraform show -no-color tfplan > "$RUNNER_TEMP/preapproval-plan.txt"

      - name: Create deployment saved plan with current runner SSH rule
        working-directory: deploy/volcengine
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan-deploy

      - name: Apply the approved deployment plan
        working-directory: deploy/volcengine
        run: terraform apply -input=false -auto-approve tfplan-deploy

      - name: Read ECS address
        id: infra
        working-directory: deploy/volcengine
        run: |
          public_ip="$(terraform output -raw public_ip)"
          test -n "$public_ip"
          echo "public_ip=$public_ip" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH trust and key
        env:
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
          PUBLIC_IP: ${{ steps.infra.outputs.public_ip }}
        run: |
          test -n "$ECS_SSH_PRIVATE_KEY"
          test -n "${{ secrets.ECS_SSH_USER }}"
          install -m 700 -d "$RUNNER_TEMP/lqam-ssh"
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lqam-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/lqam-ssh/id_ed25519"
          if [[ -n "$ECS_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$ECS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/lqam-ssh/known_hosts"
          else
            for attempt in $(seq 1 60); do
              if ssh-keyscan -H "$PUBLIC_IP" > "$RUNNER_TEMP/lqam-ssh/known_hosts" 2>/dev/null \
                && [[ -s "$RUNNER_TEMP/lqam-ssh/known_hosts" ]]; then
                break
              fi
              if [[ "$attempt" == 60 ]]; then
                echo "ECS SSH did not become ready in time." >&2
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Deploy runtime configuration and image
        id: deploy_app
        env:
          PUBLIC_IP: ${{ steps.infra.outputs.public_ip }}
          ECS_SSH_USER: ${{ secrets.ECS_SSH_USER }}
          DEPLOY_COMMIT: ${{ github.sha }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
          APP_AUTH_TOKEN: ${{ secrets.APP_AUTH_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_RUNTIME_PASSWORD: ${{ secrets.DATABASE_RUNTIME_PASSWORD }}
          ARK_BASE_URL: ${{ vars.ARK_BASE_URL }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          set -euo pipefail
          test -n "$ECS_SSH_USER"
          test -n "$ARK_API_KEY"
          test -n "$ARK_MODEL"
          test -n "$APP_AUTH_TOKEN"
          test -n "$POSTGRES_PASSWORD"
          test -n "$DATABASE_RUNTIME_PASSWORD"

          ssh_opts=(-i "$RUNNER_TEMP/lqam-ssh/id_ed25519" -o UserKnownHostsFile="$RUNNER_TEMP/lqam-ssh/known_hosts" -o StrictHostKeyChecking=yes)
          target="$ECS_SSH_USER@$PUBLIC_IP"
          for attempt in $(seq 1 60); do
            if ssh "${ssh_opts[@]}" "$target" 'test -x /opt/agent-launchpad/app/scripts/deploy-existing-ecs.sh'; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "ECS cloud-init did not finish in time." >&2
              exit 1
            fi
            sleep 5
          done

          # Keep the Compose file and deployment script aligned with the
          # commit whose image was just built. This does not build on ECS.
          ssh "${ssh_opts[@]}" "$target" "if [ \"\$(id -u)\" -eq 0 ]; then git -C /opt/agent-launchpad/app fetch --depth 1 origin '$DEPLOY_COMMIT' && git -C /opt/agent-launchpad/app checkout --detach FETCH_HEAD; else sudo git -C /opt/agent-launchpad/app fetch --depth 1 origin '$DEPLOY_COMMIT' && sudo git -C /opt/agent-launchpad/app checkout --detach FETCH_HEAD; fi"

          env_file="$RUNNER_TEMP/lqam-staging.env"
          umask 077
          {
            printf 'NODE_ENV=production\n'
            printf 'HOST=0.0.0.0\nPORT=3000\nPUBLIC_PORT=80\n'
            printf 'PERSISTENCE_BACKEND=postgres\nAUTHORIZATION_MODE=local\n'
            printf 'LAUNCHPAD_IMAGE=%s\n' "$IMAGE_REF"
            printf 'ARK_API_KEY=%s\nARK_MODEL=%s\n' "$ARK_API_KEY" "$ARK_MODEL"
            printf 'APP_AUTH_TOKEN=%s\n' "$APP_AUTH_TOKEN"
            printf 'ARK_BASE_URL=%s\n' "${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
            printf 'POSTGRES_PASSWORD=%s\nDATABASE_RUNTIME_PASSWORD=%s\n' "$POSTGRES_PASSWORD" "$DATABASE_RUNTIME_PASSWORD"
            printf 'DATABASE_ADMIN_URL=postgresql://launchpad_owner:%s@postgres:5432/launchpad\n' "$POSTGRES_PASSWORD"
            printf 'DATABASE_URL=postgresql://launchpad_app:%s@postgres:5432/launchpad\n' "$DATABASE_RUNTIME_PASSWORD"
            printf 'CODEX_SANDBOX_MODE=workspace-write\nCODEX_TIMEOUT_MS=600000\nCODEX_MAX_OUTPUT_BYTES=2097152\n'
          } > "$env_file"

          scp "${ssh_opts[@]}" "$env_file" "$target:/tmp/lqam-staging.env"
          ssh "${ssh_opts[@]}" "$target" 'if [ "$(id -u)" -eq 0 ]; then install -m 600 /tmp/lqam-staging.env /opt/agent-launchpad/app/.env.production; rm -f /tmp/lqam-staging.env; /opt/agent-launchpad/app/scripts/deploy-existing-ecs.sh /opt/agent-launchpad/app/.env.production; else sudo install -m 600 /tmp/lqam-staging.env /opt/agent-launchpad/app/.env.production; rm -f /tmp/lqam-staging.env; sudo /opt/agent-launchpad/app/scripts/deploy-existing-ecs.sh /opt/agent-launchpad/app/.env.production; fi'
          rm -f "$env_file"
          echo "app_url=http://$PUBLIC_IP" >> "$GITHUB_OUTPUT"
