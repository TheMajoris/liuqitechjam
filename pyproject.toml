[project]
name = "kuairand-autonomous-agent"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires the official KuaiRand-Pure dataset",
]
testpaths = ["tests"]
