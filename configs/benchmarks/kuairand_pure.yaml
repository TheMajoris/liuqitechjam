schema_version: 1
benchmark:
  id: kuairand-pure
  dataset: KuaiRand-Pure
  task: within-user ranking over logged impressions
  label: long_view
  positive_label_rule: source string is not "0"

starter_kit:
  directory: kuairand-starter-kit
  protected_files:
    - path: data.py
      sha256: 1bf54f5f3a9f590eab2f87f09a3c27422031867a20a5328d56cbd8c7db36e541
    - path: baseline.py
      sha256: c8f7fc60178413e247e78bb231e7550eeef52101b6493fcf1a4d2b0e5fe18f8a
    - path: evaluate.py
      sha256: ecfde28392eb14fec4f488083251df50624e1af2b86278b962daecfb42d195de
    - path: submit.py
      sha256: ab01bb2b970ae2a9f2ead299f5240b71ff4126c2d9bb0e0c4de6c7e245dc148c
    - path: baseline_scores.json
      sha256: 950f98181770c030a68bdddab7be3c0abbf060531f54455a6a6f81a4cb003324

data:
  directory: data/KuaiRand-Pure/data
  source_archive:
    url: https://zenodo.org/records/10439422/files/KuaiRand-Pure.tar.gz
    md5: 0820331067a3784d9691136f772b35a7
  input_order:
    - log_standard_4_08_to_4_21_pure.csv
    - log_standard_4_22_to_5_08_pure.csv
  preserve_source_row_order: true
  splits:
    train:
      date_min: 20220408
      date_max: 20220421
    valid:
      date_min: 20220422
      date_max: 20220428
    test:
      date_min: 20220429
      date_max: 20220508

evaluation:
  command: null
  callable: evaluate:evaluate
  scope: within_user
  metrics:
    - name: GAUC
      direction: maximize
      aggregation: positive-count-weighted mean over users with both label classes
      degenerate_users: excluded
      tie_handling: average ranks
    - name: nDCG@5
      direction: maximize
      cutoff: 5
      aggregation: unweighted mean over all users
      gain: 2^rel-1
      zero_positive_users: score 0.0 and include
      tie_handling: stable source-row order
  primary:
    name: primary
    direction: maximize
    formula: mean(GAUC, nDCG@5)
  reported_fields: [GAUC, nDCG@5, primary, users, rows]

baseline:
  command: python baseline.py --model fm --seed {seed}
  model: fm
  seeds: [0, 1, 2, 3, 4]
  reference_aggregation: mean_over_seeds
  verification_absolute_tolerance: 0.0002
  references:
    valid:
      GAUC: 0.6674
      nDCG@5: 0.5357
      primary: 0.6016
    test:
      GAUC: 0.6610
      nDCG@5: 0.5282
      primary: 0.5946
  random_reference_mean_over_seeds_0_to_4:
    valid:
      GAUC: 0.4993
      nDCG@5: 0.4675
      primary: 0.4834
    test:
      GAUC: 0.4996
      nDCG@5: 0.4511
      primary: 0.4753
  item_popularity_reference:
    valid:
      GAUC: 0.6387
      nDCG@5: 0.5227
      primary: 0.5807
    test:
      GAUC: 0.6308
      nDCG@5: 0.5121
      primary: 0.5715

submission:
  command: python submit.py --check --split test submission.csv
  format: csv
  header: [row_id, user_id, video_id, score]
  one_row_per_evaluation_row: true
  row_id:
    type: integer
    start: 0
    contiguous: true
  alignment_fields: [user_id, video_id]
  score:
    type: float
    finite: true

convergence:
  metric: primary
  direction: maximize
  epsilon: 0.002
  patience: 3
  comparison: global_best_before_iteration
