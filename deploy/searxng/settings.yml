# Minimal local-PoC settings. Change server.secret_key before exposing this
# instance beyond the local machine. The image supplies the engine list and
# defaults; this file only enables the JSON endpoint used by LQAM.
use_default_settings: true

general:
  instance_name: "LQAM local search"

search:
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "launchpad-local-poc-change-this-secret"
  limiter: false
  image_proxy: false
