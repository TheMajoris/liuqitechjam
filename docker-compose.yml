services:
  # Trusted model-gateway sidecar. The ONLY process that reads a provider
  # credential. Reachable by the control plane over the shared network and by
  # disposable Runtime containers over the internal-only network.
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
        DEBIAN_MIRROR: ${CONTAINER_APT_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${CONTAINER_APT_SECURITY_MIRROR:-}
    image: volc-agent-launchpad:local
    command: ["node", "apps/server/dist/gateway/main.js"]
    restart: unless-stopped
    env_file:
      - ${LAUNCHPAD_ENV_FILE:-.env}
    environment:
      MODEL_GATEWAY_HOST: 0.0.0.0
      MODEL_GATEWAY_PORT: 4000
    networks:
      - control-plane
      - runtime-gateway
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1

  launchpad:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
        DEBIAN_MIRROR: ${CONTAINER_APT_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${CONTAINER_APT_SECURITY_MIRROR:-}
    image: volc-agent-launchpad:local
    restart: unless-stopped
    depends_on:
      - gateway
    env_file:
      - ${LAUNCHPAD_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /app/data
      AGENT_WORKSPACE_ROOT: /app/workspaces
      CODEX_HOME: /app/codex-home
      CODEX_SANDBOX_MODE: ${CODEX_SANDBOX_MODE:-workspace-write}
      # Control plane reaches the gateway management API by service name.
      MODEL_GATEWAY_URL: http://gateway:4000
      RUNTIME_GATEWAY_NETWORK: ${RUNTIME_GATEWAY_NETWORK:-runtime-gateway}
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      - ./codex-home:/app/codex-home
    networks:
      - control-plane
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 2

networks:
  # Control plane <-> gateway management API, and the published UI port.
  control-plane:
    driver: bridge
  # Gateway <-> disposable Runtime containers only. No external egress: a
  # compromised Runtime can reach the gateway data plane and nothing else.
  runtime-gateway:
    driver: bridge
    internal: true
