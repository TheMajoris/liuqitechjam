services:
  launchpad:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
        DEBIAN_MIRROR: ${CONTAINER_APT_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${CONTAINER_APT_SECURITY_MIRROR:-}
    image: ${LAUNCHPAD_IMAGE:-volc-agent-launchpad:local}
    labels:
      org.opencontainers.image.title: "Liu Qi Agent Management (LQAM)"
      org.opencontainers.image.description: "Control and governance for autonomous multi-agent workspaces"
    restart: unless-stopped
    env_file:
      - ${LAUNCHPAD_ENV_FILE:-.env}
    command: ["sh", "-c", "npm run db:provision && npm run db:migrate && npm start"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /app/data
      AGENT_WORKSPACE_ROOT: /app/workspaces
      CODEX_HOME: /app/codex-home
      CODEX_SANDBOX_MODE: ${CODEX_SANDBOX_MODE:-workspace-write}
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.ap-southeast.bytepluses.com/api/v3}
      SUPERVISOR_MODEL: ${SUPERVISOR_MODEL:-}
      BYTEPLUS_ACCESS_KEY: ${BYTEPLUS_ACCESS_KEY:-}
      BYTEPLUS_SECRET_KEY: ${BYTEPLUS_SECRET_KEY:-}
      BYTEPLUS_REGION: ${BYTEPLUS_REGION:-ap-southeast-1}
      BYTEPLUS_MANAGEMENT_BASE_URL: ${BYTEPLUS_MANAGEMENT_BASE_URL:-https://ark.ap-southeast-1.byteplusapi.com}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080/search}
      PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://launchpad_owner:${POSTGRES_PASSWORD}@postgres:5432/launchpad}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgresql://launchpad_owner:${POSTGRES_PASSWORD}@postgres:5432/launchpad}
      DATABASE_RUNTIME_PASSWORD: ""
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      - ./codex-home:/app/codex-home
    depends_on:
      searxng:
        condition: service_started
      postgres:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 2

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${SEARXNG_PUBLIC_PORT:-8080}:8080"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1

  postgres:
    profiles: [postgres]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchpad_owner
      POSTGRES_DB: launchpad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U launchpad_owner -d launchpad"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb

volumes:
  postgres_data: